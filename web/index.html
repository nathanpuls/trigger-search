<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Search and copy snippets from a public Google Sheet.">
  <title>Trigger Search</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>Trigger Search</span>
      </div>
      <button class="icon-button" id="settings-button" type="button" aria-label="Settings">•••</button>
    </header>

    <main>
      <div class="search-wrap">
        <label class="sr-only" for="search">Search snippets</label>
        <input id="search" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" autofocus>
        <span class="shortcut-hint" aria-hidden="true">⌘ K</span>
      </div>

      <nav class="tabs" id="tabs" aria-label="Sheet tabs"></nav>
      <div class="status" id="status" role="status"></div>
      <section class="results" id="results" aria-label="Search results"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="details-dialog" class="sheet-dialog">
    <div class="dialog-head">
      <button class="back-button" id="details-back" type="button" aria-label="Back">←</button>
      <h2 id="details-title"></h2>
      <button class="close-button" data-close="details-dialog" type="button" aria-label="Close">×</button>
    </div>
    <div id="details-list" class="details-list"></div>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog">
    <form id="settings-form">
      <div class="dialog-head">
        <h2>Google Sheet</h2>
        <button class="close-button" data-close="settings-dialog" type="button" aria-label="Close">×</button>
      </div>
      <p>Paste a public Google Sheets link. Trigger Search stores it only in this browser.</p>
      <label for="sheet-url">Google Sheet link</label>
      <textarea id="sheet-url" rows="4" placeholder="https://docs.google.com/spreadsheets/d/…"></textarea>
      <p class="form-note">In Google Sheets, use File → Share → Publish to web first.</p>
      <div class="form-actions">
        <button class="secondary-button" id="disconnect-button" type="button">Disconnect</button>
        <button class="primary-button" type="submit">Connect</button>
      </div>
    </form>
  </dialog>

  <template id="result-template">
    <article class="result" tabindex="0">
      <div class="result-main">
        <div class="result-title"></div>
        <div class="result-meta"></div>
      </div>
      <div class="result-actions"></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
