name: Validate clients

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web client
        shell: pwsh
        run: node --check web/app.js

      - name: Download current AutoHotkey v2
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest" `
            -Headers @{
              "User-Agent" = "sheet-autocomplete-validation"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
            }
          $asset = $release.assets |
            Where-Object { $_.name -match '^AutoHotkey_.*\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw "The latest AutoHotkey release did not contain a ZIP asset."
          }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile autohotkey.zip
          Expand-Archive autohotkey.zip -DestinationPath autohotkey

      - name: Validate script syntax
        shell: pwsh
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe |
            Select-Object -First 1
          if (-not $exe) {
            throw "AutoHotkey64.exe was not found in the downloaded release."
          }
          & $exe.FullName `
            "/ErrorStdOut=UTF-8" `
            "/validate" `
            "$PWD\windows\autocomplete.ahk"
          $validationSucceeded = $?
          if (-not $validationSucceeded) {
            throw "AutoHotkey validation failed. See the exact AutoHotkey message above."
          }

      - name: Run chooser and filtering smoke tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe |
            Select-Object -First 1
          $result = Join-Path $env:TEMP "sheet-autocomplete-self-test.txt"
          Remove-Item $result -ErrorAction SilentlyContinue
          $test = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList @('/ErrorStdOut=UTF-8', ('"' + "$PWD\windows\autocomplete.ahk" + '"'), '--integration-test') `
            -RedirectStandardOutput "$env:TEMP\trigger-self-test-output.txt" `
            -RedirectStandardError "$env:TEMP\trigger-self-test-error.txt" `
            -PassThru
          $null = $test.Handle
          if (-not $test.WaitForExit(30000)) {
            $test.Kill()
            Get-Content "$env:TEMP\trigger-self-test-output.txt", "$env:TEMP\trigger-self-test-error.txt" -ErrorAction SilentlyContinue
            throw 'AutoHotkey runtime smoke tests timed out.'
          }
          Get-Content "$env:TEMP\trigger-self-test-output.txt", "$env:TEMP\trigger-self-test-error.txt" -ErrorAction SilentlyContinue
          if (Test-Path $result) {
            Get-Content $result
          }
          if ($test.ExitCode -ne 0) {
            throw "AutoHotkey runtime smoke tests failed with exit code $($test.ExitCode)."
          }
          if ((Get-Content $result -Raw) -ne "PASS") {
            throw "AutoHotkey runtime smoke tests did not report PASS."
          }

      - name: Verify legacy updater bridge
        shell: pwsh
        run: |
          $legacy = (Get-FileHash autocomplete.ahk -Algorithm SHA256).Hash
          $current = (Get-FileHash windows/autocomplete.ahk -Algorithm SHA256).Hash
          if ($legacy -ne $current) {
            throw "The root compatibility script differs from the Windows source."
          }


      - name: Validate release manifest
        shell: pwsh
        run: python tools/build-release.py --check

      - name: Validate PowerShell and automation workers
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows\refresh-all.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          foreach ($file in Get-ChildItem automations -Recurse -Filter *.ahk) {
            $p = Start-Process $exe.FullName -ArgumentList @('/ErrorStdOut=UTF-8', '/validate', ('"' + $file.FullName + '"')) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Worker validation failed: $file" }
            $workerOut = Join-Path $env:TEMP ('trigger-worker-' + $file.BaseName + '-out.txt')
            $workerErr = Join-Path $env:TEMP ('trigger-worker-' + $file.BaseName + '-err.txt')
            $testMode = if ($file.Name -eq 'helpers.ahk') { '--integration-test' } else { '--self-test' }
            $p = Start-Process $exe.FullName -ArgumentList @('/ErrorStdOut=UTF-8', ('"' + $file.FullName + '"'), $testMode) -PassThru -RedirectStandardOutput $workerOut -RedirectStandardError $workerErr
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Worker dry run timed out: $file" }
            if ($p.ExitCode -ne 0) {
              Get-Content $workerOut, $workerErr -ErrorAction SilentlyContinue
              throw "Worker dry run failed: $file"
            }
          }

      - name: Validate optional standalone Chrome shortcut
        shell: pwsh
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          $file = "$PWD\windows\standalone\focus-general-chrome.ahk"
          $p = Start-Process $exe.FullName -ArgumentList @('/ErrorStdOut=UTF-8', '/validate', ('"' + $file + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Standalone Chrome syntax validation failed.' }
          $p = Start-Process $exe.FullName -ArgumentList @(('"' + $file + '"'), '--self-test') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Standalone Chrome selection checks failed.' }

      - name: Verify automation strikethrough formatting
        shell: pwsh
        run: ./tests/windows-automation-formatting.ps1

      - name: Verify public formatting export once when requested
        if: contains(github.event.head_commit.message, '[verify-public-format]')
        shell: pwsh
        run: ./tests/windows-automation-formatting.ps1 -LiveSheetId '15JTaedzH2ZfT2FAb7FduyMg37aBCHTKborM7E0y8nts' -ExpectedDisabledId 'dell.plan-navigation'

      - name: Exercise reversible Startup setup in an isolated folder
        shell: pwsh
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          ./tests/windows-startup.ps1 -AutoHotkeyPath $exe.FullName

      - name: Exercise manual install and rollback
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          ./tests/windows-refresh.ps1 -AutoHotkeyPath $exe.FullName -Ref $env:SOURCE_COMMIT

      - name: Replay Right Control handler events
        shell: pwsh
        run: |
          $exe = Get-ChildItem autohotkey -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          $result = Join-Path $env:TEMP 'trigger-search-keyboard-test.txt'
          Remove-Item $result -ErrorAction SilentlyContinue
          $p = Start-Process $exe.FullName -ArgumentList @(('"' + "$PWD\windows\autocomplete.ahk" + '"'), '--keyboard-test') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'Keyboard hook test timed out.' }
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0 -or (Get-Content $result -Raw) -ne 'PASS: handler replay; physical keyboard unverified') { throw 'Keyboard handler replay failed.' }
